services:
  postgres:
    image: postgres:16-alpine
    container_name: apm-postgres
    environment:
      POSTGRES_DB: apm
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm
    ports:
      - "5432:5432"
    volumes:
      - apm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apm-postgres-data:
