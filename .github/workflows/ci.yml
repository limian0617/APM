name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apm
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apm -d apm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apm:apm@localhost:5432/apm?schema=public
      RUN_DATABASE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run db:generate
      - run: npm run db:validate
      - name: APM-104 empty database replay
        run: |
          npm run db:migrate:deploy
          npm run test -- src/modules/archives/infrastructure/apm-054-to-apm-104-upgrade.integration.test.ts src/modules/archives/infrastructure/project-archive.integration.test.ts src/modules/projects/application/project-close-service.integration.test.ts src/modules/retrospectives/application/project-retrospective-service.integration.test.ts src/modules/knowledge/infrastructure/knowledge-persistence.integration.test.ts src/modules/knowledge/infrastructure/knowledge-entry-version-mutation.integration.test.ts src/modules/knowledge/infrastructure/knowledge-search-capability.integration.test.ts src/modules/knowledge/application/knowledge-entry-service.integration.test.ts src/modules/knowledge/application/knowledge-reuse-service.integration.test.ts
      - name: APM-104 normal pg_trgm replay
        run: RUN_DATABASE_INTEGRATION=1 APM104_NORMAL_TRIGRAM=1 npm run test -- src/modules/knowledge/infrastructure/knowledge-search-capability.integration.test.ts
      - name: Validate APM-004 to UI baseline upgrade migration
        shell: bash
        run: |
          export PGPASSWORD=apm
          createdb -h localhost -U apm apm_upgrade_apm004
          upgrade_root="$RUNNER_TEMP/apm-upgrade-apm004-$GITHUB_RUN_ID"
          mkdir -p "$upgrade_root/prisma/migrations"
          cp prisma/schema.prisma "$upgrade_root/prisma/schema.prisma"
          cp -R prisma/migrations/20260802000000_init "$upgrade_root/prisma/migrations/"
          cp -R prisma/migrations/20260802010000_apm_002_authorization "$upgrade_root/prisma/migrations/"
          cp -R prisma/migrations/20260802020000_apm_003_audit_service "$upgrade_root/prisma/migrations/"
          cp -R prisma/migrations/20260802030000_apm_004_configuration_jobs "$upgrade_root/prisma/migrations/"
          DATABASE_URL="postgresql://apm:apm@localhost:5432/apm_upgrade_apm004?schema=public" \
            npx prisma migrate deploy --schema "$upgrade_root/prisma/schema.prisma"
          DATABASE_URL="postgresql://apm:apm@localhost:5432/apm_upgrade_apm004?schema=public" \
            npm run db:migrate:deploy
