name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma only parses this URL during schema validation and build; CI does not connect to it.
      DATABASE_URL: postgresql://apm:apm@localhost:5432/apm?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run build
